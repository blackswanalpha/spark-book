[package]
name = "spark-book"
version = "0.8.0"
description = "sparkBook — text, images, animation and PDFs in one window"
authors = ["sparkBook team"]
edition = "2021"

[lib]
name = "spark_book_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: the media player streams video and audio from disk
# with range requests instead of loading whole files into the webview.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
# Named directly so the log plugin's level filters can be configured and
# the watcher can report a truncated walk.
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Explorer delete goes to the OS trash (freedesktop Trash, macOS Trash,
# Windows Recycle Bin) so a mis-click is recoverable.
trash = "5"

# Terminal: real PTY + in-process VT emulation. Replaces the xterm.js
# renderer — the frontend receives a ready-to-paint cell grid.
portable-pty = "0.9"
vt100 = "0.16"

# Explorer live-refresh: watch the open folder so the tree reflects
# changes made outside the app.
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
